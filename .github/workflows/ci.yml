name: SCAMTRACE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scamtrace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend scripts
      - name: Run unit and integration tests
        run: python -m pytest

  security-gates:
    name: Security behavior gates
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate checked-in model artifact
        run: python scripts/validate_release.py
      - name: Run behavioral decision contracts
        run: python scripts/evaluate_decision_contracts.py
      - name: Run authored adversarial gate
        run: python scripts/evaluate_adversarial.py
      - name: Run deterministic demo scenarios
        run: python scripts/run_demo.py
      - name: Upload generated evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scamtrace-ci-reports
          path: reports/*evaluation.*
          if-no-files-found: warn

  api-smoke:
    name: Local API smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Start local service and check health
        shell: bash
        run: |
          set -euo pipefail
          python -m backend.main > /tmp/scamtrace-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          endpoint = "http://127.0.0.1:8765/api/status"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(endpoint, timeout=1) as response:
                      status = json.load(response)
                  assert status["application"] == "SCAMTRACE"
                  assert status["classifier"]["available"] is True
                  assert status["privacy"]["cloud_api_calls"] == "NONE"
                  print(json.dumps({"status": "pass", "version": status["version"]}, indent=2))
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Local SCAMTRACE API did not become ready.")
          PY
